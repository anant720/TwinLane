[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twinlane"
version = "0.1.0"
description = "A zero-trust protocol and reference implementation for prompt-injection-resistant agent-to-agent communication"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Anant" },
    { name = "Shweta" },
    { name = "Aditya" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "click>=8.1.7",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12.20240311",
    "matplotlib>=3.8.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
twinlane = "twinlane.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/twinlane"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["E501"] # Line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "."]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["hypothesis.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers -p no:cacheprovider"

[tool.coverage.run]
source = ["src/twinlane"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
